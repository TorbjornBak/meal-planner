# MealPlanner — app + Postgres (§10, §12).
#
# HTTPS is handled by `tailscale serve` on the host, not by a reverse proxy in
# Compose. The app publishes port 3000 to the host loopback; tailscaled (running
# on the host, joined to the tailnet) serves it over HTTPS on the MagicDNS
# *.ts.net name:
#
#   tailscale serve --bg 3000
#
# That exposes the app on the tailnet only — no public exposure, no
# port-forwarding, no cert management (§10).

# Pinned so the named volume below is always `mealplanner_pgdata`, no matter
# which directory compose is invoked from (dev checkout vs. /srv/mealplanner).
name: mealplanner

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mealplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mealplanner}
      POSTGRES_DB: ${POSTGRES_DB:-mealplanner}
    ports:
      # Loopback-only, so `npm run dev` on the host can reach it without
      # exposing Postgres to the tailnet. The app container talks to `db`
      # over the compose network regardless.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mealplanner}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # CI sets APP_IMAGE to the freshly built, SHA-tagged image from the Forgejo
    # registry. Locally it falls back to a build from this directory, so
    # `docker compose up -d --build` still works unchanged.
    image: ${APP_IMAGE:-mealplanner-app:local}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-mealplanner}:${POSTGRES_PASSWORD:-mealplanner}@db:5432/${POSTGRES_DB:-mealplanner}?schema=public"
      AUTH_SECRET: ${AUTH_SECRET}
      # Email (§9, §9b) — password resets, invitations, the weekly digest.
      # Optional: with SMTP_HOST unset the app runs, it just can't send mail.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # "false" only for a self-signed certificate on a server you control.
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      # Absolute base for links in email — emails are read away from the app,
      # so there's no request to infer an origin from. Your MagicDNS name (§10).
      APP_URL: ${APP_URL:-}
      # Bearer token for triggering a send by hand, e.g. to re-run one week
      # (§9b). The scheduled send no longer needs it.
      CRON_SECRET: ${CRON_SECRET:-}
      # The weekly digest schedules itself in-process (§9b) — there is no
      # crontab to keep. Friday 17:00 Europe/Copenhagen unless overridden.
      DIGEST_SEND_DAY: ${DIGEST_SEND_DAY:-FRI}
      DIGEST_SEND_HOUR: ${DIGEST_SEND_HOUR:-17}
      DIGEST_TIMEZONE: ${DIGEST_TIMEZONE:-Europe/Copenhagen}
      # "off" to stop the app sending it at all.
      DIGEST_SCHEDULER: ${DIGEST_SCHEDULER:-on}
      # Backups (§11) — nightly Borg archives of the database.
      #
      # With BORG_REPO unset the app runs and says, on the settings screen,
      # that nothing is being backed up. Set both and it backs up nightly and
      # tells you whether it worked.
      #
      # BORG_PASSPHRASE is the only thing that can decrypt the archives, so it
      # has to be written down somewhere that isn't this box. It deliberately
      # never reaches the database — the one it would be needed to restore.
      BORG_REPO: ${BORG_REPO:-}
      BORG_PASSPHRASE: ${BORG_PASSPHRASE:-}
      # Wall clock in BACKUP_TIMEZONE, so it doesn't drift when the clocks change.
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-Europe/Copenhagen}
      # "off" to stop the app backing up on its own; the button still works.
      BACKUP_SCHEDULER: ${BACKUP_SCHEDULER:-on}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      # Set to the same thing the app computes for itself, so that borg run by
      # hand inside the container — `docker compose exec app borg list` — finds
      # the key and the known_hosts the nightly backup uses. That is also the
      # first half of a restore; see README.
      BORG_RSH: "ssh -i /var/lib/mealplanner/ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/var/lib/mealplanner/ssh/known_hosts"
      BORG_BASE_DIR: /var/lib/mealplanner/borg
      # The container is UTC otherwise, which would make every local time in
      # the logs an hour or two out from the household's clocks.
      TZ: ${TZ:-Europe/Copenhagen}
    volumes:
      # The backup identity and borg's deduplication cache (§11). Has to
      # outlive the container: the key because the storage box has been told to
      # trust it, and the cache because without it every night's backup starts
      # by re-reading the whole repository.
      - backupstate:/var/lib/mealplanner
    ports:
      # Loopback-only; `tailscale serve` on the host proxies this to the tailnet
      # over HTTPS. Not reachable from the LAN.
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  backupstate:
