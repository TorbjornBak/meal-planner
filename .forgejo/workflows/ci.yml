# Fast feedback on every push and pull request: types must check out and the
# unit tests must pass.
# The heavier `next build` is covered by the image build in deploy.yml.
name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  typecheck:
    runs-on: docker
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      # tsc needs the generated Prisma client to resolve @prisma/client types.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      # borg lets src/lib/borg.integration.test.mjs actually run: it creates a
      # scratch repository, writes an encrypted archive, reads it back and
      # prunes it. Without borg that file skips itself, and the argument lists
      # the nightly backup depends on would only ever be checked against
      # themselves.
      - name: Install borg
        run: apt-get update && apt-get install -y --no-install-recommends borgbackup

      - name: Test
        run: npm test
